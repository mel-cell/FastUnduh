steps:
  - name: probe
    image: docker.io/library/alpine:3
    commands:
      - echo "=== docker sock ==="
      - ls -la /var/run/docker.sock 2>&1 || echo "no /var/run/docker.sock"
      - echo "=== DOCKER_HOST ==="
      - echo "$DOCKER_HOST"
      - echo "=== podman cli ==="
      - podman --version 2>&1 || echo "no podman cli"
      - echo "=== podman via socket ==="
      - DOCKER_HOST=unix:///run/podman/podman.sock podman ps --format "{{.Names}}" 2>&1 | head -5
    when:
      event: [manual]
